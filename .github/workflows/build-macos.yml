name: Build macOS App

on:
  workflow_dispatch:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

concurrency:
  group: macos-build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Show Xcode version
        run: xcodebuild -version

      - name: Run platform-neutral smoke tests
        shell: bash
        run: |
          set -euo pipefail
          for test in scripts/*_smoke_test.swift; do
            echo "::group::${test}"
            xcrun swift "${test}"
            echo "::endgroup::"
          done

      - name: Build Release app
        run: |
          xcodebuild \
            -project GestureControl.xcodeproj \
            -scheme GestureControl \
            -configuration Release \
            -destination 'platform=macOS' \
            -derivedDataPath "$RUNNER_TEMP/DerivedData" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            clean build

      - name: Package app
        run: |
          mkdir -p dist
          cp -R "$RUNNER_TEMP/DerivedData/Build/Products/Release/GestureControl.app" dist/GestureControl.app
          ditto -c -k --sequesterRsrc --keepParent dist/GestureControl.app dist/GestureControl-macOS-unsigned.zip

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: GestureControl-macOS-unsigned
          path: dist/GestureControl-macOS-unsigned.zip
          if-no-files-found: error
